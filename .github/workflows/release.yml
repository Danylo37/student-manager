name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create draft release
        shell: bash
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if [ -z "$(gh api repos/$GITHUB_REPOSITORY/releases --jq ".[] | select(.draft and .tag_name==\"$TAG\") | .id")" ]; then
            gh release create "$TAG" --draft --title "${TAG#v}" --notes ""
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
